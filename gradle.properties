org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dhttps.protocols=TLSv1.2,TLSv1.3
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Disable non-ASCII characters check for project path
android.overridePathCheck=true

# ============================================================
# 认证正式化配置（v1.0.3）
# ------------------------------------------------------------
# 微信开放平台 AppID：未配置（留空）时微信授权自动降级为沙盒模拟模式。
# 申请地址：https://open.weixin.qq.com （移动应用 → 创建应用 → AppID）
WECHAT_APP_ID=
# ------------------------------------------------------------
# 阿里云短信服务（手机号验证码速登正式通道）：
# 未配置（留空）时验证码走本地沙盒生成并明文回显，仅用于开发调试。
# 配置后 PhoneAuthManager 将调用 Dysmsapi SendSms 真实下发验证码。
# 申请地址：https://dysmsapi.aliyuncs.com （短信服务 → 签名管理 + 模板管理）
ALIYUN_SMS_ACCESS_KEY_ID=
ALIYUN_SMS_ACCESS_KEY_SECRET=
# 短信签名（如「阅痕」）与验证码模板 Code（如 SMS_123456789）
ALIYUN_SMS_SIGN_NAME=
ALIYUN_SMS_TEMPLATE_CODE=
# ============================================================
