name: Release & Publish APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare signing (official keystore via secrets, fallback debug keystore)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          PROPS_B64: ${{ secrets.RELEASE_KEYSTORE_PROPERTIES_BASE64 }}
        run: |
          # AGP 在 CI 上不会自动生成 debug.keystore，而 release 回退签名（initWith debug）依赖它，
          # 缺失会导致 validateSigningRelease 直接失败
          mkdir -p /home/runner/.config/.android
          if [ ! -f /home/runner/.config/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore /home/runner/.config/.android/debug.keystore \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          # 可选：若已配置正式签名 Secrets（Base64），则恢复正式签名发布；否则用 debug 签名兜底
          if [ -n "$KEYSTORE_B64" ] && [ -n "$PROPS_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > readtrace-release.jks
            echo "$PROPS_B64" | base64 -d > keystore.properties
            echo "Official keystore restored from secrets."
          else
            echo "No official keystore secrets configured; falling back to debug signing."
          fi

      - name: Build Release & Debug APKs
        run: ./gradlew assembleRelease assembleDebug

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [[ "$TAG_NAME" == *"main"* ]] || [[ "$TAG_NAME" == *"master"* ]]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          fi
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="v$(date +'%Y%m%d')"
          fi
          
          mkdir -p dist
          
          # 复制并规范命名 APK
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/ReadTrace-${TAG_NAME}-universal-release.apk"
          fi
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "dist/ReadTrace-${TAG_NAME}-debug.apk"
          fi
          
          # 生成 SHA256 校验和清单
          cd dist
          sha256sum ReadTrace-*.apk > sha256sums.txt
          cat sha256sums.txt
          cd ..
          
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_artifacts.outputs.tag_name }}
          name: "阅痕 ReadTrace ${{ steps.prepare_artifacts.outputs.tag_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/ReadTrace-*.apk
            dist/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
